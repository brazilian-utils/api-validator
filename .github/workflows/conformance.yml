# Full cross-library run: every lib at its latest default branch, contract + shared tests +
# differential testing. Fails on regressions against baselines/ and on new divergences. The
# status site (output/site: a page per lib and per function, badges, the JSON suite) is
# uploaded as an artifact and, when vars.PUBLISH_DASHBOARD == 'true', published to GitHub
# Pages (vars.SITE_URL = its public URL, used in README snippets).
name: Conformance

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["contract/**", "libs/**"]
  pull_request:
    paths: ["contract/**", "libs/**", "baselines/**", "src/**"]

jobs:
  conformance:
    runs-on: ubuntu-latest
    env:
      # Token with issues:write on the lib repos, used by the issue sync step (skipped when unset).
      GH_TOKEN: ${{ secrets.LIBS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: dtolnay/rust-toolchain@stable
      # nightly is only used for rustdoc's JSON output (the precise API extraction)
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .cache/brazilian-utils-rust/rust-runner
      - run: npm ci
      - run: npx tsx src/cli.ts sync
      - name: Install lib dependencies (needed to run the shared tests)
        run: |
          pip install ./.repos/brazilian-utils-python
          (cd .repos/brazilian-utils-ruby && bundle install --quiet) || true
      - name: Contract + shared tests (fails on regressions)
        run: npx tsx src/cli.ts check --tests --summary "$GITHUB_STEP_SUMMARY"
      # Fails only when libs split in a way baselines/_divergences.json does not know: a new
      # bug, or a lib changing behaviour. Known splits are listed in the report, not failed on.
      - name: Differential testing (fails on new divergences)
        if: always()
        run: |
          status=0
          npx tsx src/cli.ts diff --fail-on-new || status=$?
          cat output/diff.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Contract changes in this PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          npx tsx src/cli.ts changelog --from FETCH_HEAD --to WORKTREE --out "$GITHUB_STEP_SUMMARY"
      # Keep one "api-contract" issue per lib repo in sync with what that lib still has to do.
      # Needs a token with issues:write on the lib repos (secret LIBS_TOKEN); skipped otherwise.
      - name: Sync issues in the lib repositories
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.GH_TOKEN != ''
        run: |
          mapfile -t libs < <(npx tsx src/cli.ts libs)
          for entry in "${libs[@]}"; do
            read -r lib repo <<< "$entry"
            [ -n "$repo" ] || continue
            npx tsx src/cli.ts issue --lib "$lib" --tests > /dev/null || continue
            gh label create api-contract -R "$repo" --color 0E8A16 --description "Shared API contract work" --force
            number=$(gh issue list -R "$repo" --label api-contract --state open --json number -q '.[0].number')
            if [ -n "$number" ]; then
              gh issue edit "$number" -R "$repo" --body-file "output/$lib.issue.md"
            else
              gh issue create -R "$repo" --label api-contract --title "API contract: pending work" --body-file "output/$lib.issue.md"
            fi
          done
      # Keep each lib's vendored conformance suite (api-contract/: JSON cases + its skip list)
      # current: refresh it in a fresh clone and open/update an "api-contract/cases" PR when
      # it changed. Needs contents:write + pull-requests:write on the lib repos (LIBS_TOKEN).
      - name: Sync the conformance suite into the lib repositories
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.GH_TOKEN != ''
        run: |
          git config --global user.name "api-validator[bot]"
          git config --global user.email "api-validator@users.noreply.github.com"
          branch=api-contract/cases
          mapfile -t libs < <(npx tsx src/cli.ts libs)
          for entry in "${libs[@]}"; do
            read -r lib repo <<< "$entry"
            [ -n "$repo" ] || continue
            dir="$RUNNER_TEMP/export/$lib"
            rm -rf "$dir"
            gh repo clone "$repo" "$dir" -- --depth=1 --quiet || continue
            npx tsx src/cli.ts export-cases --lib "$lib" --path "$dir" > "$RUNNER_TEMP/export-$lib.log" || { cat "$RUNNER_TEMP/export-$lib.log"; continue; }
            git -C "$dir" add -A api-contract
            git -C "$dir" diff --cached --quiet && continue
            {
              echo "Refreshed by the nightly [api-validator](https://github.com/${{ github.repository }}) run: the shared JSON conformance suite and this lib's skip list."
              echo
              echo '```'
              cat "$RUNNER_TEMP/export-$lib.log"
              echo '```'
              echo
              echo "Entries leave skip.json as the lib fixes them; the harness then runs those cases."
            } > "$RUNNER_TEMP/pr-$lib.md"
            git -C "$dir" checkout -q -B "$branch"
            git -C "$dir" commit -q -m "test: update API contract cases"
            git -C "$dir" push -q --force origin "$branch"
            if [ -z "$(gh pr list -R "$repo" --head "$branch" --state open --json number -q '.[0].number')" ]; then
              gh pr create -R "$repo" --head "$branch" --title "test: update API contract cases" --body-file "$RUNNER_TEMP/pr-$lib.md" --label api-contract
            fi
          done
      - name: Build the status site
        if: always()
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npx tsx src/cli.ts site --out output/site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: output/
      - uses: actions/upload-pages-artifact@v3
        if: always() && vars.PUBLISH_DASHBOARD == 'true' && github.ref == 'refs/heads/main'
        with:
          path: output/site/

  publish:
    needs: conformance
    if: always() && vars.PUBLISH_DASHBOARD == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
