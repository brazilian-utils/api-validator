# The one pipeline: every lib at its latest default branch, contract + shared tests +
# differential testing, issues in the lib repos, the vendored suite PRs, and the docs site
# (site/, Next.js + Fumadocs, static export) built from the contract, the libs' usage files and this run's results.
# Fails on regressions against baselines/ and on new divergences.
#
# Publishing: the site goes to GitHub Pages from main when vars.PUBLISH_SITE == 'true'.
# vars.SITE_URL is its public URL, path included (default: https://<owner>.github.io/<repo>);
# the issues link to it and the README badges point at it.
name: Conformance

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Open issues for contract changes since this git ref (e.g. a commit before a merge whose run failed)"
        required: false
      backfill:
        description: "Also open issues for everything already missing or failing"
        type: choice
        options: [none, core, all]
        default: none
  # A lib's release workflow sends this so the site shows the released usage files at once.
  repository_dispatch:
    types: [lib-released]
  push:
    branches: [main]
    paths: ["contract/**", "libs/**", "baselines/**", "schema/**", "site/**", "src/**", "package*.json", ".github/workflows/conformance.yml"]
  pull_request:
    paths: ["contract/**", "libs/**", "baselines/**", "schema/**", "src/**", "package*.json", ".github/workflows/conformance.yml"]

# A push to main is never cancelled or replaced by a later run: its issues step is the only one
# that opens the issues for that merge. Other runs of a ref queue one at a time; a PR's newer
# run cancels the older.
concurrency:
  group: conformance-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance:
    runs-on: ubuntu-latest
    # The job runs the libraries' own code (their tests, installs, builds, `prepare`): its token
    # only reads, and LIBS_TOKEN never reaches it (the lib-repos job below holds it).
    permissions:
      contents: read
    outputs:
      site: ${{ steps.site.outputs.built }}
    env:
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the PR step compares the contract with the base branch
          persist-credentials: false # no token left in .git/config for the libraries' code
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: dtolnay/rust-toolchain@stable
      # nightly is only used for rustdoc's JSON output (the precise API extraction)
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .cache/brazilian-utils-rust/rust-runner
      - run: npm ci
      - run: npx tsx src/cli.ts sync
      - name: Install lib dependencies (needed to run the shared tests)
        run: |
          pip install ./.repos/brazilian-utils-python
          (cd .repos/brazilian-utils-ruby && bundle install --quiet) || true
      - name: Contract + shared tests (fails on regressions)
        run: npx tsx src/cli.ts check --tests --summary "$GITHUB_STEP_SUMMARY"
      # Fails only when libs split in a way baselines/_divergences.json does not know: a new
      # bug, or a lib changing behaviour. Known splits are listed in the report, not failed on.
      - name: Differential testing (fails on new divergences)
        if: always()
        run: |
          status=0
          npx tsx src/cli.ts diff --fail-on-new || status=$?
          cat output/diff.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Contract changes in this PR
        if: always() && github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          npx tsx src/cli.ts changelog --from FETCH_HEAD --to WORKTREE --out "$GITHUB_STEP_SUMMARY"
          {
            echo "## Issues this merge will open in the libs"
            echo
            echo '```'
            npx tsx src/cli.ts issues --since FETCH_HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Each lib's vendored conformance suite (api-contract/: JSON cases + its skip list), exported
      # into a fresh clone. Reading a lib's API builds some of them, so this runs here, without
      # LIBS_TOKEN; the lib-repos job only applies the resulting patch.
      - name: Export the conformance suite for each lib
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p output/lib-sync
          mapfile -t libs < <(npx tsx src/cli.ts libs)
          for entry in "${libs[@]}"; do
            read -r lib repo <<< "$entry"
            [ -n "$repo" ] || continue
            dir="$RUNNER_TEMP/export/$lib"
            rm -rf "$dir"
            git clone -q --depth=1 "https://github.com/$repo.git" "$dir" || continue
            npx tsx src/cli.ts export-cases --lib "$lib" --path "$dir" > "output/lib-sync/$lib.log" 2>&1 || { cat "output/lib-sync/$lib.log"; continue; }
            git -C "$dir" add -A api-contract
            git -C "$dir" diff --cached --quiet && continue
            git -C "$dir" diff --cached --binary > "output/lib-sync/$lib.patch"
            echo "$repo" > "output/lib-sync/$lib.repo"
          done
      # Which implemented functions each lib shows on the site (its docs/usage/, else the
      # fixtures in site/fixtures/usage/); informative, never fails the run.
      - name: Usage files
        if: always()
        run: |
          {
            echo "## Usage examples on the docs site"
            echo
            echo '```'
            npx tsx src/cli.ts usage || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Docs site data (status per lib and function, badges, JSON suite)
        if: always()
        run: npx tsx src/cli.ts site-data
      - name: Build the docs site
        if: always()
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # fetch-libs: the libs' docs/usage/ at their latest release
        run: |
          npm ci
          npm run check:i18n -- --strict
          npm run lint
          npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: output/
      # Only a site that built is published: after a failed build the last site stays up.
      - id: site
        if: always() && hashFiles('site/out/index.html') != '' && vars.PUBLISH_SITE == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: echo "built=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: always() && steps.site.outputs.built == 'true'
        with:
          path: site/out/

  # Everything that writes to the lib repositories, with LIBS_TOKEN, in a job that runs no library
  # code: a fresh checkout of this repository, the report and patches of the job above, and the
  # lib repos cloned only to read the reference source the issues embed.
  lib-repos:
    needs: conformance
    if: always() && needs.conformance.result != 'cancelled' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_LIBS_TOKEN: ${{ secrets.LIBS_TOKEN != '' }}
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_LIBS_TOKEN == 'true'
        with:
          fetch-depth: 0 # issues --since compares the contract with the commit before the merge
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: env.HAS_LIBS_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_LIBS_TOKEN == 'true'
        run: npm ci
      - uses: actions/download-artifact@v4
        if: env.HAS_LIBS_TOKEN == 'true'
        with:
          name: conformance-report
          path: output/
      - name: Clone the libs (read only, for the reference source in the issues)
        if: env.HAS_LIBS_TOKEN == 'true'
        run: npx tsx src/cli.ts sync
      # One issue per function per lib. On a merge to main: an "Implement <fn>" issue in every
      # lib missing a function the merge added, and a "Fix <fn>" issue in every lib failing a
      # case the merge added or changed. Every run also refreshes open issues and closes the
      # ones the lib has done. Needs issues:write on the lib repos.
      - name: Open, refresh and close issues in the lib repositories
        if: env.HAS_LIBS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.LIBS_TOKEN }}
          SINCE: ${{ github.event_name == 'push' && github.event.before || inputs.since }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          args=(issues --apply)
          if [ -n "$SINCE" ] && [ "$SINCE" != "0000000000000000000000000000000000000000" ]; then args+=(--since "$SINCE"); fi
          if [ -n "$BACKFILL" ] && [ "$BACKFILL" != "none" ]; then args+=(--backfill "$BACKFILL"); fi
          npx tsx src/cli.ts "${args[@]}"
      # The exported suites that changed: pushed to an "api-contract/cases" branch of the lib, with
      # a PR. Needs contents:write + pull-requests:write on the lib repos.
      - name: Sync the conformance suite into the lib repositories
        if: always() && env.HAS_LIBS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.LIBS_TOKEN }}
        run: |
          gh auth setup-git # pushes below authenticate with GH_TOKEN
          git config --global user.name "api-validator[bot]"
          git config --global user.email "api-validator@users.noreply.github.com"
          branch=api-contract/cases
          for patch in output/lib-sync/*.patch; do
            [ -e "$patch" ] || continue
            lib=$(basename "$patch" .patch)
            repo=$(cat "output/lib-sync/$lib.repo")
            dir="$RUNNER_TEMP/sync/$lib"
            rm -rf "$dir"
            gh repo clone "$repo" "$dir" -- --depth=1 --quiet || continue
            git -C "$dir" apply --index "$GITHUB_WORKSPACE/$patch" || { echo "::warning::$lib: the exported suite does not apply to $repo any more; next run"; continue; }
            {
              echo "Refreshed by the nightly [api-validator](https://github.com/${{ github.repository }}) run: the shared JSON conformance suite and this lib's skip list."
              echo
              echo '```'
              cat "output/lib-sync/$lib.log"
              echo '```'
              echo
              echo "Entries leave skip.json as the lib fixes them; the harness then runs those cases."
            } > "$RUNNER_TEMP/pr-$lib.md"
            git -C "$dir" checkout -q -B "$branch"
            git -C "$dir" commit -q -m "test: update API contract cases"
            git -C "$dir" push -q --force origin "$branch"
            if [ -z "$(gh pr list -R "$repo" --head "$branch" --state open --json number -q '.[0].number')" ]; then
              gh label create api-contract -R "$repo" --color 0E8A16 --description "Shared API contract work" --force
              gh pr create -R "$repo" --head "$branch" --title "test: update API contract cases" --body-file "$RUNNER_TEMP/pr-$lib.md" --label api-contract
            fi
          done

  publish:
    needs: conformance
    if: always() && needs.conformance.outputs.site == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
