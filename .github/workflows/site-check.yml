# Pull request checks for the site: dependencies audited, both languages present, site builds.
name: site / check

on:
  pull_request:
    paths:
      - 'site/specs/**'
      - 'site/fixtures/**'
      - 'site/src/**'
      - 'site/scripts/**'
      - 'site/libs.yaml'
      - 'site/astro.config.mjs'
      - 'site/package.json'
      - 'site/package-lock.json'
      - 'site/.npmrc'
      - '.github/workflows/site-*.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check-i18n compares last-commit dates
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: No known vulnerabilities, at any severity
        run: npm audit --audit-level=low
      - name: Every spec and page has both languages
        run: npm run check:i18n -- --strict
      - name: Site builds
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
