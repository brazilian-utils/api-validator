# Pull request checks for the docs site: dependencies audited, both languages present, the site
# builds from the contract and the usage fixtures. The full pipeline (conformance.yml) builds
# and publishes it with the results of a run.
name: site / check

on:
  pull_request:
    paths:
      - 'contract/**'
      - 'libs/**'
      - 'site/**'
      - '.github/workflows/site-check.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check-i18n compares last-commit dates of each language pair
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: No known vulnerabilities, at any severity
        run: npm audit --audit-level=low
      - name: Every domain and page has both languages
        run: npm run check:i18n -- --strict
      - name: Site builds (usage from the fixtures, no status)
        run: npm run build
        env:
          USAGE_SOURCE: fixtures
