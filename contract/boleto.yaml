  parse:
    summary: Removes boleto formatting characters and returns only digits.
    description: |
      Removes boleto formatting and keeps only digits, capped to 47 digits (48 for a boleto de arrecadação).
    references:
      - https://www.bcb.gov.br/pre/normativos/c_circ/2000/pdf/c_circ_2926_v1_O.pdf
      - https://cmsarquivos.febraban.org.br/Arquivos/documentos/PDF/Layout%20-%20C%C3%B3digo%20de%20Barras%20-%20Vers%C3%A3o%208%20-%2011_05_2026.pdf
      - https://portal.febraban.org.br/pagina/3425/33/pt-br/layout-febraban
    params:
      - name: value
        type: string | number
    returns: string
    tests:
      - name: masked
        args: ["10491.44338 55119.000002 00000.000141 3 25230000093423"]
        returns: "10491443385511900000200000000141325230000093423"
      - name: arrecadacao-masked
        args: ["84610000000-5 24610029110-2 00546033900-4 69589506108-0"]
        returns: "846100000005246100291102005460339004695895061080"
      - name: empty
        args: [""]
        returns: ""
