domain: cei
functions:
  format:
    summary: Formats a CEI (Cadastro Específico do INSS) number according to the usual "00.000.00000/00" mask, the one the reference
      implementations of the check digit agree on (the Receita Federal does not print it).
    params:
      - name: value
        type: string | number
      - name: options
        type: FormatCeiOptions
        optional: true
    returns: string
    tests:
      - args: ["277297118187"]
        returns: "27.729.71181/87"
      - name: already-formatted
        args: ["11.583.00249/85"]
        returns: "11.583.00249/85"
      - name: partial
        args: ["27729"]
        returns: "27.729"
      - name: empty
        args: [""]
        returns: ""
  isValid:
    summary: Validates a CEI (Cadastro Específico do INSS) number.
    params:
      - name: value
        type: string | number
    returns: boolean
    tests:
      - args: ["11.583.00249/85"]
        returns: true
      - args: ["115830024985"]
        returns: true
      - args: ["277297118187"]
        returns: true
      - name: wrong-check-digit
        args: ["115830024984"]
        returns: false
      - name: zeros
        args: ["000000000000"]
        returns: false
      - name: too-short
        args: ["1234567890"]
        returns: false
      - name: letters
        args: ["aa.583.00249/85"]
        returns: false
      - name: empty
        args: [""]
        returns: false
  parse:
    summary: Removes CEI (Cadastro Específico do INSS) formatting characters and returns only digits.
    params:
      - name: value
        type: string | number
    returns: string
    tests:
      - name: masked
        args: ["27.729.71181/87"]
        returns: "277297118187"
      - name: unmasked
        args: ["277297118187"]
        returns: "277297118187"
      - name: strips-non-digits
        args: ["27.?ABC729.71181/87abc"]
        returns: "277297118187"
      - name: empty
        args: [""]
        returns: ""
      - name: caps-length
        args: ["277297118187999"]
        returns: "277297118187"
        note: reference truncates to the 12 characters of the document; asserted by the reference (JS) unit tests
