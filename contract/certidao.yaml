domain: certidao
functions:
  format:
    summary: Formats the matrícula of a certidão de registro civil into the printed mask of the norm, the 32 digits grouped as 6 2 2 4 1 5 3 7 2
      and separated by spaces.
    params:
      - name: value
        type: string | number
      - name: options
        type: FormatCertidaoOptions
        optional: true
    returns: string
    tests:
      - args: ["10453901552013100012021000012321"]
        returns: "104539 01 55 2013 1 00012 021 0000123 21"
      - name: remasks
        args: ["104539.01.55.2013.1.00012.021.0000123-21"]
        returns: "104539 01 55 2013 1 00012 021 0000123 21"
      - name: partial
        args: ["10453901"]
        returns: "104539 01"
      - name: empty
        args: [""]
        returns: ""
  getInfo:
    summary: Parses the matrícula of a certidão de registro civil into its fields.
    flatName: getCertidaoInfo
    params:
      - name: value
        type: string
    returns: CertidaoInfo?
    tests:
      - args: ["104539 01 55 2013 1 00012 021 0000123 21"]
        returns:
          registryCns: "104539"
          acervo: "01"
          service: "55"
          year: 2013
          type: "birth"
          typeCode: 1
          book: "00012"
          page: "021"
          term: "0000123"
          checkDigits: "21"
      - args: ["094300 01 55 2010 1 00020 112 0000120-87"]
        returns:
          registryCns: "094300"
          acervo: "01"
          service: "55"
          year: 2010
          type: "birth"
          typeCode: 1
          book: "00020"
          page: "112"
          term: "0000120"
          checkDigits: "87"
      - name: wrong-check-digits
        args: ["10453901552013100012021000012322"]
        returns: null
      - args: ["not-a-matricula"]
        returns: null
      - name: empty
        args: [""]
        returns: null
  isValid:
    summary: Validates the matrícula of a certidão de registro civil (nascimento, casamento, óbito and the other acts kept by a serventia de
      registro civil das pessoas naturais).
    params:
      - name: value
        type: string
      - name: options
        type: IsValidCertidaoOptions
        optional: true
    returns: boolean
    tests:
      - args: ["10453901552013100012021000012321"]
        returns: true
      - name: masked
        args: ["104539 01 55 2013 1 00012 021 0000123 21"]
        returns: true
      - args: ["094003 01 55 2011 1 00110 002 0051917 43"]
        returns: true
      - name: wrong-check-digits
        args: ["10453901552013100012021000012322"]
        returns: false
      - name: too-short
        args: ["104539015520131000120210000123"]
        returns: false
      - name: empty
        args: [""]
        returns: false
  parse:
    summary: Removes the formatting of the matrícula of a certidão de registro civil and returns only digits.
    params:
      - name: value
        type: string | number
    returns: string
    tests:
      - name: masked
        args: ["104539 01 55 2013 1 00012 021 0000123 21"]
        returns: "10453901552013100012021000012321"
      - name: strips-non-digits
        args: ["104539.01.55.2013.1.00012.021.0000123-21abc"]
        returns: "10453901552013100012021000012321"
      - name: caps-length
        args: ["10453901552013100012021000012321999"]
        returns: "10453901552013100012021000012321"
        note: reference truncates to 32 digits; asserted by the reference (JS) unit tests
      - name: empty
        args: [""]
        returns: ""
