domain: cno
functions:
  format:
    summary: Formats a CNO (Cadastro Nacional de Obras) number according to the official mask.
    params:
      - name: value
        type: string | number
      - name: options
        type: FormatCnoOptions
        optional: true
    returns: string
    tests:
      - args: ["111130137368"]
        returns: "11.113.01373/68"
      - name: already-formatted
        args: ["11.084.01680/62"]
        returns: "11.084.01680/62"
      - name: partial
        args: ["11113"]
        returns: "11.113"
      - name: empty
        args: [""]
        returns: ""
  isValid:
    summary: Validates a CNO (Cadastro Nacional de Obras) number, the registration of a construction work with the Receita Federal.
    params:
      - name: value
        type: string | number
    returns: boolean
    tests:
      - args: ["110840168062"]
        returns: true
      - name: masked
        args: ["11.084.01680/62"]
        returns: true
      - args: ["401800097960"]
        returns: true
      - name: wrong-check-digit
        args: ["110840168063"]
        returns: false
      - name: zeros
        args: ["000000000000"]
        returns: false
      - name: too-short
        args: ["1234567890"]
        returns: false
      - name: empty
        args: [""]
        returns: false
  parse:
    summary: Removes CNO (Cadastro Nacional de Obras) formatting characters and returns only digits.
    params:
      - name: value
        type: string | number
    returns: string
    tests:
      - name: masked
        args: ["11.113.01373/68"]
        returns: "111130137368"
      - name: unmasked
        args: ["111130137368"]
        returns: "111130137368"
      - name: strips-non-digits
        args: ["11.?ABC113.01373/68abc"]
        returns: "111130137368"
      - name: empty
        args: [""]
        returns: ""
      - name: caps-length
        args: ["111130137368999"]
        returns: "111130137368"
        note: reference truncates to the 12 characters of the document; asserted by the reference (JS) unit tests
