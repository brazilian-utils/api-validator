domain: currency
functions:
  convertToWords:
    summary: Formats a monetary amount in Brazilian Reais as its "por extenso" textual representation, the style used to write out the amount by
      hand on cheques and contracts, e.g. `1523.45` becomes `"mil quinhentos e vinte e três reais e quarenta e cinco centavos"`.
    flatName: convertCurrencyToWords
    aliases:
      - currency.convertRealToText
    level: core
    params:
      - name: value
        type: number
    returns: string
    tests:
      - name: zero
        args: [0]
        returns: "zero reais"
      - name: one-cent
        args: [0.01]
        returns: "um centavo"
      - name: one-real
        args: [1]
        returns: "um real"
      - name: one-real-one-cent
        args: [1.01]
        returns: "um real e um centavo"
      - name: only-cents
        args: [0.5]
        returns: "cinquenta centavos"
      - name: cem
        args: [100]
        returns: "cem reais"
      - name: summary-example
        args: [1523.45]
        returns: "mil quinhentos e vinte e três reais e quarenta e cinco centavos"
      - name: round-million
        args: [1000000]
        returns: "um milhão de reais"
      - name: round-millions
        args: [2000000]
        returns: "dois milhões de reais"
      - name: million-and-more
        args: [1000230]
        returns: "um milhão duzentos e trinta reais"
      - name: negative
        args: [-5.5]
        returns: "menos cinco reais e cinquenta centavos"
      - name: truncates-sub-cent
        args: [1.999]
        returns: "um real e noventa e nove centavos"
        note: the reference truncates (does not round) beyond 2 decimal places; asserted by the reference (JS) unit tests
  format:
    summary: Formats a given value as a currency string in Brazilian Real (BRL).
    level: core
    params:
      - name: value
        type: string | number
      - name: options
        type: FormatCurrencyOptions
        optional: true
    returns: string
    tests:
      - name: thousands
        args: [1000.01]
        returns: "1.000,01"
        note: "without options the reference prints no currency symbol (`{ symbol: true }` adds `R$ `); asserted by the reference (JS) unit tests"
      - name: cents
        args: [0.01]
        returns: "0,01"
      - name: integer
        args: [1]
        returns: "1,00"
      - name: millions
        args: [1000000.01]
        returns: "1.000.000,01"
      - name: negative
        args: [-10.1]
        returns: "-10,10"
      - name: string-dot-decimal
        args: ["1234.56"]
        returns: "1.234,56"
      - name: string-brazilian
        args: ["1.234,56"]
        returns: "1.234,56"
      - name: string-with-symbol
        args: ["R$ 1.234,56"]
        returns: "1.234,56"
  parse:
    summary: Parses a string representing Brazilian currency format into a number.
    params:
      - name: value
        type: string
      - name: options
        type: ParseCurrencyOptions
        optional: true
    returns: number
    tests:
      - name: with-symbol
        args: ["R$ 1.234,56"]
        returns: 1234.56
      - name: comma-decimal
        args: ["1234,56"]
        returns: 1234.56
      - name: cents
        args: ["R$ 0,50"]
        returns: 0.5
      - name: millions
        args: ["1.000.000,50"]
        returns: 1000000.5
      - name: negative
        args: ["-1.234,56"]
        returns: -1234.56
      - name: zero
        args: ["0,00"]
        returns: 0
      - name: digits-only-read-as-cents
        args: ["1234"]
        returns: 12.34
        note: "CONTENTIOUS: a value with no separator is read as cents by the reference (asserted by its tests; formatCurrency reads '1234' as whole
          units)"
      - name: empty
        args: [""]
        returns: 0
        note: the reference returns 0 for an empty string (asserted by its tests)
