domain: date
aliases:
  - dateUtils
functions:
  addBusinessDays:
    summary: Adds a number of Brazilian business days (dias úteis) to a date.
    flatName: addBusinessDays
    params:
      - name: date
        type: date
      - name: amount
        type: number
      - name: options
        type: BusinessDayOptions
        optional: true
    returns: date?
  convertToWords:
    summary: Formats a date as its Brazilian Portuguese "por extenso" textual representation, e.g. `"01/01/2024"` becomes `"primeiro de janeiro
      de dois mil e vinte e quatro"`.
    flatName: convertDateToWords
    aliases:
      - date.convertDateToText
    params:
      - name: value
        type: date | string
      - name: options
        type: ConvertDateToWordsOptions
        optional: true
    returns: string
    tests:
      - name: first-of-month
        args: ["01/01/2024"]
        returns: "primeiro de janeiro de dois mil e vinte e quatro"
      - args: ["02/01/2024"]
        returns: "dois de janeiro de dois mil e vinte e quatro"
      - args: ["25/12/2024"]
        returns: "vinte e cinco de dezembro de dois mil e vinte e quatro"
      - name: iso-string
        args: ["2024-12-25"]
        returns: "vinte e cinco de dezembro de dois mil e vinte e quatro"
      - name: leap-day
        args: ["29/02/2000"]
        returns: "vinte e nove de fevereiro de dois mil"
      - name: not-a-leap-year
        args: ["29/02/2023"]
        returns: ""
        note: "invalid dates: the reference returns an empty string (asserted by its tests); some libs return null/None"
      - name: day-out-of-range
        args: ["31/04/2024"]
        returns: ""
      - name: garbage
        args: ["not a date"]
        returns: ""
      - name: empty
        args: [""]
        returns: ""
  differenceInBusinessDays:
    summary: Counts the number of Brazilian business days (dias úteis) between two dates.
    flatName: differenceInBusinessDays
    params:
      - name: laterDate
        type: date
      - name: earlierDate
        type: date
      - name: options
        type: BusinessDayOptions
        optional: true
    returns: number?
  getHolidays:
    summary: Retrieves all Brazilian holidays for a given year.
    flatName: getHolidays
    params:
      - name: year
        type: number
    returns: Holiday[]
  isBusinessDay:
    summary: Checks whether a given date is a Brazilian business day (dia útil).
    flatName: isBusinessDay
    params:
      - name: value
        type: date
      - name: options
        type: BusinessDayOptions
        optional: true
    returns: boolean
  isHoliday:
    summary: Checks whether a given date is a Brazilian holiday.
    flatName: isHoliday
    level: core
    params:
      - name: options
        type: IsHolidayParams
        optional: true
    returns: boolean
  subBusinessDays:
    summary: Subtracts a number of Brazilian business days (dias úteis) from a date.
    flatName: subBusinessDays
    params:
      - name: date
        type: date
      - name: amount
        type: number
      - name: options
        type: BusinessDayOptions
        optional: true
    returns: date?
