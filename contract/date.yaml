  isBusinessDay:
    summary: Checks whether a given date is a Brazilian business day (dia útil).
    description: |
      Checks whether a date is a Brazilian business day (dia útil): not a Saturday, a Sunday or a holiday of `date.getHolidays`, by its local calendar date.

      - `options` may count the optional holidays (Carnaval, Corpus Christi; counted by default) and one state's holidays.
      - Returns false for an invalid date or a year outside 1900 to 2099.
    references:
      - https://www.planalto.gov.br/ccivil_03/leis/l0662.htm
      - https://www.planalto.gov.br/ccivil_03/leis/2002/l10607.htm
      - https://www.planalto.gov.br/ccivil_03/leis/l6802.htm
      - https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14759.htm
      - https://www.planalto.gov.br/ccivil_03/leis/l9093.htm
      - https://www.in.gov.br/web/dou/-/portaria-mgi-n-11.460-de-29-de-dezembro-de-2025-678388627
    flatName: isBusinessDay
    params:
      - name: value
        type: date
      - name: options
        type: BusinessDayOptions
        optional: true
    returns: boolean
  isHoliday:
    summary: Checks whether a given date is a Brazilian holiday.
    description: |
      Checks whether a date is a Brazilian holiday, by its local calendar date.

      - `options` carries the target date and, optionally, a state code whose holidays also count (an unknown code is ignored).
      - Returns false when the date is missing or invalid.
    references:
      - https://www.planalto.gov.br/ccivil_03/leis/l0662.htm
      - https://www.planalto.gov.br/ccivil_03/leis/2002/l10607.htm
      - https://www.planalto.gov.br/ccivil_03/leis/l6802.htm
      - https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14759.htm
      - https://www.planalto.gov.br/ccivil_03/leis/l9093.htm
      - https://www.in.gov.br/web/dou/-/portaria-mgi-n-11.460-de-29-de-dezembro-de-2025-678388627
    flatName: isHoliday
    level: core
    params:
      - name: options
        type: IsHolidayParams
        optional: true
    returns: boolean
  subBusinessDays:
    summary: Subtracts a number of Brazilian business days (dias úteis) from a date.
    description: |
      Subtracts a number of Brazilian business days from a date: the same as `date.addBusinessDays` with the opposite `amount`.

      - Same rules as `date.addBusinessDays`; a negative `amount` walks forwards.
    flatName: subBusinessDays
    params:
      - name: date
        type: date
      - name: amount
        type: number
      - name: options
        type: BusinessDayOptions
        optional: true
    returns: date?
