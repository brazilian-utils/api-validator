domain: date
title: Dates, holidays and business days
description: Brazilian holidays, business days (dias úteis) and dates written out in words.
aliases:
  - dateUtils
functions:
  addBusinessDays:
    summary: Adds a number of Brazilian business days (dias úteis) to a date.
    description: |
      Adds a number of Brazilian business days (dias úteis) to a date, skipping Saturdays, Sundays and the holidays `date.isBusinessDay` skips.

      - `options` may count the optional holidays (Carnaval, Corpus Christi; counted by default) and one state's holidays.
      - Returns a new date with the time of day preserved; the input is never mutated.
      - An `amount` of 0 returns the same date, even on a non-business day; a negative `amount` walks backwards.
      - Returns null for an invalid date, a non-integer `amount`, or a result outside the years 1900 to 2099.
    flatName: addBusinessDays
    params:
      - name: date
        type: date
      - name: amount
        type: number
      - name: options
        type: BusinessDayOptions
        optional: true
    returns: date?
  convertToWords:
    summary: Formats a date as its Brazilian Portuguese "por extenso" textual representation, e.g. `"01/01/2024"` becomes `"primeiro de janeiro
      de dois mil e vinte e quatro"`.
    description: |
      Writes a date in Brazilian Portuguese words ("por extenso"), e.g. "primeiro de janeiro de dois mil e vinte e quatro".

      - `value` is a date (its local calendar date) or a string `dd/mm/yyyy` or ISO `yyyy-mm-dd`.
      - Day 1 is "primeiro"; `options` can spell out only the month (digits for day and year, day 1 as `1º`) and prefix the weekday.
      - Pending decision (findings §1b): the reference (JS) writes all lower case and parses ISO strings; Go and Ruby capitalise and do not parse ISO strings.
      - Pending decision (findings §2 #9): for an invalid date, a malformed string, a day or month that does not exist, or a year before 1 the reference (JS) returns an empty string; other libs return null.
    flatName: convertDateToWords
    aliases:
      - date.convertDateToText
    params:
      - name: value
        type: date | string
      - name: options
        type: ConvertDateToWordsOptions
        optional: true
    returns: string
    tests:
      - name: first-of-month
        args: ["01/01/2024"]
        returns: "primeiro de janeiro de dois mil e vinte e quatro"
      - args: ["02/01/2024"]
        returns: "dois de janeiro de dois mil e vinte e quatro"
      - args: ["25/12/2024"]
        returns: "vinte e cinco de dezembro de dois mil e vinte e quatro"
      - name: iso-string
        args: ["2024-12-25"]
        returns: "vinte e cinco de dezembro de dois mil e vinte e quatro"
      - name: leap-day
        args: ["29/02/2000"]
        returns: "vinte e nove de fevereiro de dois mil"
      - name: not-a-leap-year
        args: ["29/02/2023"]
        returns: ""
        note: "invalid dates: the reference returns an empty string (asserted by its tests); some libs return null/None"
      - name: day-out-of-range
        args: ["31/04/2024"]
        returns: ""
      - name: garbage
        args: ["not a date"]
        returns: ""
      - name: empty
        args: [""]
        returns: ""
  differenceInBusinessDays:
    summary: Counts the number of Brazilian business days (dias úteis) between two dates.
    description: |
      Counts the Brazilian business days between two dates.

      - Counts `earlierDate` when it is a business day and every business day strictly between the two; `laterDate` is never counted. The time of day is ignored.
      - Negative when `laterDate` is before `earlierDate`; 0 on the same calendar day.
      - `options` as in `date.addBusinessDays`.
      - Returns null when either date is invalid or outside the years 1900 to 2099.
    flatName: differenceInBusinessDays
    params:
      - name: laterDate
        type: date
      - name: earlierDate
        type: date
      - name: options
        type: BusinessDayOptions
        optional: true
    returns: number?
  getHolidays:
    summary: Retrieves all Brazilian holidays for a given year.
    description: |
      Returns the national Brazilian holidays of a year, sorted by date.

      - Each holiday has a name, a date and a type: national, state, optional (e.g. Carnaval, Corpus Christi) or religious.
      - "Dia da Consciência Negra" (Nov 20) is national from 2024 on.
      - Returns an empty list when `year` is not an integer from 1900 to 2099.
