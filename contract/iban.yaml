domain: iban
title: IBAN — International Bank Account Number
description: "Brazilian IBANs (country code BR): validation, formatting, parsing and decoding."
functions:
  format:
    summary: Formats an IBAN in the ISO 13616 print grouping, blocks of 4 characters, the presentation used on statements and bank forms.
    description: |
      Formats an IBAN in the ISO 13616 print grouping: blocks of 4 characters separated by spaces, upper-cased. Does not validate (use `iban.isValid`).

      - Only letters and digits are read; the result is capped at the 29 characters of a Brazilian IBAN.
    references:
      - https://www.bcb.gov.br/pre/normativos/circ/2013/pdf/circ_3625_v1_O.pdf
      - https://www.bcb.gov.br/content/estabilidadefinanceira/Documents/sistema_pagamentos_brasileiro/IBAN-Guidelines_%20port.pdf
    params:
      - name: value
        type: string
    returns: string
    tests:
      - args: ["BR1500000000000010932840814P2"]
        returns: "BR15 0000 0000 0000 1093 2840 814P 2"
      - name: lowercase
        args: ["br1500000000000010932840814p2"]
        returns: "BR15 0000 0000 0000 1093 2840 814P 2"
      - name: partial
        args: ["BR150"]
        returns: "BR15 0"
      - name: empty
        args: [""]
        returns: ""
  getInfo:
    summary: Parses a Brazilian IBAN (International Bank Account Number) into its fields.
    description: |
      Parses a Brazilian IBAN into its fields; returns null whenever `iban.isValid` would return false.

      - Fields, all strings: country code, check digits, bank ISPB, branch, account, account type and owner.
    references:
      - https://www.bcb.gov.br/pre/normativos/circ/2013/pdf/circ_3625_v1_O.pdf
      - https://www.bcb.gov.br/content/estabilidadefinanceira/Documents/sistema_pagamentos_brasileiro/IBAN-Guidelines_%20port.pdf
      - https://www.iso.org/standard/81090.html
      - https://www.iso.org/standard/31531.html
    flatName: getIbanInfo
    params:
      - name: value
        type: string
    returns: IbanInfo?
    tests:
      - args: ["BR1500000000000010932840814P2"]
        returns:
          countryCode: "BR"
          checkDigits: "15"
          bankIspb: "00000000"
          branch: "00001"
          account: "0932840814"
          accountType: "P"
          owner: "2"
      - name: masked
        args: ["BR15 0000 0000 0000 1093 2840 814P 2"]
        returns:
          countryCode: "BR"
          checkDigits: "15"
          bankIspb: "00000000"
          branch: "00001"
          account: "0932840814"
          accountType: "P"
          owner: "2"
      - args: ["BR3860701190000010000012345C1"]
        returns:
          countryCode: "BR"
          checkDigits: "38"
          bankIspb: "60701190"
          branch: "00001"
          account: "0000012345"
          accountType: "C"
          owner: "1"
      - name: wrong-check
        args: ["BR1500000000000010932840814P3"]
        returns: null
      - name: not-brazilian
        args: ["DE89370400440532013000"]
        returns: null
      - name: empty
        args: [""]
        returns: null
  isValid:
    summary: Validates a Brazilian IBAN (International Bank Account Number).
    description: |
      Validates a Brazilian IBAN; any other country is invalid.

      - Layout, 29 characters: `BR`, 2 check digits (ISO 7064 MOD 97-10), 8-digit ISPB, 5-digit branch, 10-digit account, 1-letter account type (usually `C` or `P`), 1 owner indicator (`1` to `9`, then `A` to `Z`).
      - Accepts the compact form or groups of 4 split by one whitespace, `.`, `-` or `/`, in any case; a separator inside a group makes it invalid.
    references:
      - https://www.bcb.gov.br/pre/normativos/circ/2013/pdf/circ_3625_v1_O.pdf
      - https://www.bcb.gov.br/content/estabilidadefinanceira/Documents/sistema_pagamentos_brasileiro/IBAN-Guidelines_%20port.pdf
      - https://www.iso.org/standard/81090.html
      - https://www.iso.org/standard/31531.html
    params:
      - name: value
        type: string
    returns: boolean
    tests:
      - args: ["BR1500000000000010932840814P2"]
        returns: true
      - name: masked
        args: ["BR15 0000 0000 0000 1093 2840 814P 2"]
        returns: true
      - name: lowercase
        args: ["br1500000000000010932840814p2"]
        returns: true
      - name: wrong-check
        args: ["BR1500000000000010932840814P3"]
        returns: false
      - name: not-brazilian
        args: ["DE89370400440532013000"]
        returns: false
      - name: too-short
        args: ["BR15000000000000109328408"]
        returns: false
      - name: empty
        args: [""]
        returns: false
  parse:
    summary: Removes IBAN formatting characters, uppercases the result and returns the compact IBAN.
    description: |
      Removes IBAN formatting, keeps letters and digits upper-cased, capped to 29 characters.
    references:
      - https://www.bcb.gov.br/pre/normativos/circ/2013/pdf/circ_3625_v1_O.pdf
      - https://www.bcb.gov.br/content/estabilidadefinanceira/Documents/sistema_pagamentos_brasileiro/IBAN-Guidelines_%20port.pdf
    params:
      - name: value
        type: string | number
    returns: string
    tests:
      - name: masked
        args: ["BR15 0000 0000 0000 1093 2840 814P 2"]
        returns: "BR1500000000000010932840814P2"
      - name: lowercase-mixed-separators
        args: ["br15-0000.0000/0000 1093 2840 814p-2"]
        returns: "BR1500000000000010932840814P2"
      - name: caps-length
        args: ["BR1500000000000010932840814P2EXTRA"]
        returns: "BR1500000000000010932840814P2"
        note: reference truncates to 29 characters; asserted by the reference (JS) unit tests
      - name: empty
        args: [""]
        returns: ""
