domain: iban
functions:
  format:
    summary: Formats an IBAN in the ISO 13616 print grouping, blocks of 4 characters, the presentation used on statements and bank forms.
    params:
      - name: value
        type: string
    returns: string
    tests:
      - args: ["BR1500000000000010932840814P2"]
        returns: "BR15 0000 0000 0000 1093 2840 814P 2"
      - name: lowercase
        args: ["br1500000000000010932840814p2"]
        returns: "BR15 0000 0000 0000 1093 2840 814P 2"
      - name: partial
        args: ["BR150"]
        returns: "BR15 0"
      - name: empty
        args: [""]
        returns: ""
  getInfo:
    summary: Parses a Brazilian IBAN (International Bank Account Number) into its fields.
    flatName: getIbanInfo
    params:
      - name: value
        type: string
    returns: IbanInfo?
    tests:
      - args: ["BR1500000000000010932840814P2"]
        returns:
          countryCode: "BR"
          checkDigits: "15"
          bankIspb: "00000000"
          branch: "00001"
          account: "0932840814"
          accountType: "P"
          owner: "2"
      - name: masked
        args: ["BR15 0000 0000 0000 1093 2840 814P 2"]
        returns:
          countryCode: "BR"
          checkDigits: "15"
          bankIspb: "00000000"
          branch: "00001"
          account: "0932840814"
          accountType: "P"
          owner: "2"
      - args: ["BR3860701190000010000012345C1"]
        returns:
          countryCode: "BR"
          checkDigits: "38"
          bankIspb: "60701190"
          branch: "00001"
          account: "0000012345"
          accountType: "C"
          owner: "1"
      - name: wrong-check
        args: ["BR1500000000000010932840814P3"]
        returns: null
      - name: not-brazilian
        args: ["DE89370400440532013000"]
        returns: null
      - name: empty
        args: [""]
        returns: null
  isValid:
    summary: Validates a Brazilian IBAN (International Bank Account Number).
    params:
      - name: value
        type: string
    returns: boolean
    tests:
      - args: ["BR1500000000000010932840814P2"]
        returns: true
      - name: masked
        args: ["BR15 0000 0000 0000 1093 2840 814P 2"]
        returns: true
      - name: lowercase
        args: ["br1500000000000010932840814p2"]
        returns: true
      - name: wrong-check
        args: ["BR1500000000000010932840814P3"]
        returns: false
      - name: not-brazilian
        args: ["DE89370400440532013000"]
        returns: false
      - name: too-short
        args: ["BR15000000000000109328408"]
        returns: false
      - name: empty
        args: [""]
        returns: false
  parse:
    summary: Removes IBAN formatting characters, uppercases the result and returns the compact IBAN.
    params:
      - name: value
        type: string | number
    returns: string
    tests:
      - name: masked
        args: ["BR15 0000 0000 0000 1093 2840 814P 2"]
        returns: "BR1500000000000010932840814P2"
      - name: lowercase-mixed-separators
        args: ["br15-0000.0000/0000 1093 2840 814p-2"]
        returns: "BR1500000000000010932840814P2"
      - name: caps-length
        args: ["BR1500000000000010932840814P2EXTRA"]
        returns: "BR1500000000000010932840814P2"
        note: reference truncates to 29 characters; asserted by the reference (JS) unit tests
      - name: empty
        args: [""]
        returns: ""
