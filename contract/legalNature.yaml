domain: legalNature
title: Natureza jurídica — legal nature
description: Legal nature codes of the IBGE/CONCLA Natureza Jurídica 2021 table.
functions:
  format:
    summary: Formats a Brazilian legal nature (natureza jurídica) code.
    description: |
      Formats a legal nature code as `NNN-N`; use `legalNature.isValid` to check the code.

      - The mask is applied as far as the digits go; `options.pad` left-pads with zeros to 4 digits first.
    references:
      - https://concla.ibge.gov.br/estrutura/natjur-estrutura/natureza-juridica-2021
      - https://concla.ibge.gov.br/images/concla/documentacao/CONCLA-TNJ2021-EstruturaDetalhada.pdf
    params:
      - name: value
        type: string | number
      - name: options
        type: FormatLegalNatureOptions
        optional: true
    returns: string
    tests:
      - args: ["2062"]
        returns: "206-2"
      - name: already-formatted
        args: ["206-2"]
        returns: "206-2"
      - name: partial
        args: ["206"]
        returns: "206"
      - name: empty
        args: [""]
        returns: ""
  generate:
    summary: Generates a random valid Brazilian legal nature (natureza jurídica) code.
    description: |
      Generates a random valid legal nature code (4 digits), drawn only among the 92 codes in force, never a retired one.
    references:
      - https://concla.ibge.gov.br/estrutura/natjur-estrutura/natureza-juridica-2021
      - https://concla.ibge.gov.br/images/concla/documentacao/CONCLA-TNJ2021-EstruturaDetalhada.pdf
    params: []
    returns: string
    tests:
      - name: generated-is-valid
        args: []
        satisfies: legalNature.isValid
        repeat: 5
        note: every generated value must pass the lib's own validator
  get:
    summary: Looks a Brazilian legal nature (natureza jurídica) code up.
    description: |
      Looks a legal nature code up in the IBGE/CONCLA Natureza Jurídica 2021 table; returns null for an unknown code.

      - The entry has the code, its description and its CONCLA category (given by the first digit).
      - A code retired by a past revision comes back flagged as legacy, with the code it corresponds to today, or none when it has no successor.
    references:
      - https://concla.ibge.gov.br/estrutura/natjur-estrutura/natureza-juridica-2021
      - https://concla.ibge.gov.br/images/concla/documentacao/CONCLA-TNJ2021-EstruturaDetalhada.pdf
    params:
      - name: value
        type: string | number
    returns: LegalNature?
    tests:
      - args: ["2062"]
        returns:
          code: "2062"
          description: "Sociedade Empresária Limitada"
          category:
            code: "2"
            description: "Entidades Empresariais"
          legacy: false
      - name: masked
        args: ["206-2"]
        returns:
          code: "2062"
          description: "Sociedade Empresária Limitada"
          category:
            code: "2"
            description: "Entidades Empresariais"
          legacy: false
      - name: legacy-code
        args: ["2208"]
        returns:
          code: "2208"
          description: "Entidade Binacional Itaipu"
          category:
            code: "2"
            description: "Entidades Empresariais"
          legacy: true
          currentCode: "2275"
      - args: ["0000"]
        returns: null
      - name: too-short
        args: ["206"]
        returns: null
      - name: empty
        args: [""]
        returns: null
  getDescription:
    summary: Description of a legal nature code.
    level: core
    params:
      - name: code
        type: string
    returns: string?
    tests:
      - args: ["2240"]
        returns: "Sociedade Simples Limitada"
        note: consensus of 4 libs (go, python, ruby, rust)
      - args: ["224-0"]
        returns: "Sociedade Simples Limitada"
        note: consensus of 4 libs (go, python, ruby, rust)
  isValid:
    summary: Validates if a Brazilian legal nature (natureza jurídica) code exists.
    description: |
      Checks whether a legal nature code exists in the IBGE/CONCLA Natureza Jurídica 2021 table.

      - The 92 codes in force are accepted, plus the 8 codes a past revision retired (`legalNature.get` tells them apart).
      - Only hyphens, dots and whitespace are tolerated around the 4 digits.
    references:
      - https://concla.ibge.gov.br/estrutura/natjur-estrutura/natureza-juridica-2021
      - https://concla.ibge.gov.br/images/concla/documentacao/CONCLA-TNJ2021-EstruturaDetalhada.pdf
      - https://concla.ibge.gov.br/classificacoes/correspondencias/natureza-juridica.html
      - https://concla.ibge.gov.br/images/concla/documentacao/correspTNJ2003(1)-2009.xls
      - https://concla.ibge.gov.br/images/concla/documentacao/correspTNJ1995-2002-2003.xls
    level: core
    params:
      - name: code
        type: string
    returns: boolean
    tests:
      - args: ["3329"]
        returns: false
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["0000"]
        returns: false
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["2240"]
        returns: true
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["2241"]
        returns: false
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["3311"]
        returns: false
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["224-0"]
        returns: true
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: [""]
        returns: false
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["   "]
        returns: false
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["abc"]
        returns: false
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
  list:
    summary: Returns every Brazilian legal nature (natureza jurídica) published by the CONCLA.
    description: |
      Returns the legal nature table as a map from code to description.

      - Only the 92 codes in force by default; `params` can include the 8 retired codes.
      - The table is CONCLA's Natureza Jurídica 2021 (findings §1b: some libs still ship an older table).
    references:
      - https://concla.ibge.gov.br/estrutura/natjur-estrutura/natureza-juridica-2021
      - https://concla.ibge.gov.br/images/concla/documentacao/CONCLA-TNJ2021-EstruturaDetalhada.pdf
    flatName: getLegalNatures
    aliases:
