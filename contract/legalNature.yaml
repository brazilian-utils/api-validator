domain: legalNature
functions:
  format:
    summary: Formats a Brazilian legal nature (natureza jurídica) code.
    params:
      - name: value
        type: string | number
      - name: options
        type: FormatLegalNatureOptions
        optional: true
    returns: string
  generate:
    summary: Generates a random valid Brazilian legal nature (natureza jurídica) code.
    params: []
    returns: string
    tests:
      - name: generated-is-valid
        args: []
        satisfies: legalNature.isValid
        repeat: 5
        note: every generated value must pass the lib's own validator
  get:
    summary: Looks a Brazilian legal nature (natureza jurídica) code up.
    params:
      - name: value
        type: string | number
    returns: LegalNature?
  getDescription:
    summary: Description of a legal nature code.
    level: core
    params:
      - name: code
        type: string
    returns: string?
    tests:
      - args: ["2240"]
        returns: "Sociedade Simples Limitada"
        note: consensus of 4 libs (go, python, ruby, rust)
      - args: ["224-0"]
        returns: "Sociedade Simples Limitada"
        note: consensus of 4 libs (go, python, ruby, rust)
  isValid:
    summary: Validates if a Brazilian legal nature (natureza jurídica) code exists.
    level: core
    params:
      - name: code
        type: string
    returns: boolean
    tests:
      - args: ["3329"]
        returns: false
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["0000"]
        returns: false
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["2240"]
        returns: true
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["2241"]
        returns: false
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["3311"]
        returns: false
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["224-0"]
        returns: true
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: [""]
        returns: false
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["   "]
        returns: false
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["abc"]
        returns: false
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
  list:
    summary: Returns every Brazilian legal nature (natureza jurídica) published by the CONCLA.
    flatName: getLegalNatures
    aliases:
      - legalNature.listAll
    level: core
    params:
      - name: params
        type: GetLegalNaturesParams
        optional: true
    returns: object
  listByCategory:
    summary: Retrieves every Brazilian legal nature (natureza jurídica) of a CONCLA category.
    flatName: getLegalNaturesByCategory
    params:
      - name: category
        type: string | number
      - name: options
        type: GetLegalNaturesByCategoryOptions
        optional: true
    returns: LegalNature[]
  parse:
    summary: Removes legal nature (natureza jurídica) formatting characters and returns only digits.
    params:
      - name: value
        type: string | number
    returns: string
