  listByCategory:
    summary: Retrieves every Brazilian legal nature (natureza jurídica) of a CONCLA category.
    description: |
      Returns every legal nature of a CONCLA category (the first digit of the code), sorted by code.

      - Categories: 1 Administração Pública, 2 Entidades Empresariais, 3 Entidades sem Fins Lucrativos, 4 Pessoas Físicas, 5 Organizações Internacionais e Outras Instituições Extraterritoriais.
      - `category` may be a string or a number; `options` can include the retired codes.
      - Returns an empty list for an unknown category.
    references:
      - https://concla.ibge.gov.br/estrutura/natjur-estrutura/natureza-juridica-2021
      - https://concla.ibge.gov.br/images/concla/documentacao/CONCLA-TNJ2021-EstruturaDetalhada.pdf
    flatName: getLegalNaturesByCategory
    params:
      - name: category
        type: string | number
      - name: options
        type: GetLegalNaturesByCategoryOptions
        optional: true
    returns: LegalNature[]
    tests:
      - name: category-5
        args: ["5"]
        returns:
          - code: "5010"
            description: "Organização Internacional"
            category:
              code: "5"
              description: "Organizações Internacionais e Outras Instituições Extraterritoriais"
            legacy: false
          - code: "5029"
            description: "Representação Diplomática Estrangeira"
            category:
              code: "5"
              description: "Organizações Internacionais e Outras Instituições Extraterritoriais"
            legacy: false
          - code: "5037"
            description: "Outras Instituições Extraterritoriais"
            category:
              code: "5"
              description: "Organizações Internacionais e Outras Instituições Extraterritoriais"
            legacy: false
      - name: number
        args: [5]
        returns:
          - code: "5010"
            description: "Organização Internacional"
            category:
              code: "5"
              description: "Organizações Internacionais e Outras Instituições Extraterritoriais"
            legacy: false
          - code: "5029"
            description: "Representação Diplomática Estrangeira"
            category:
              code: "5"
              description: "Organizações Internacionais e Outras Instituições Extraterritoriais"
            legacy: false
          - code: "5037"
            description: "Outras Instituições Extraterritoriais"
            category:
              code: "5"
              description: "Organizações Internacionais e Outras Instituições Extraterritoriais"
            legacy: false
      - name: category-4
        args: ["4"]
        returns:
          - code: "4014"
            description: "Empresa Individual Imobiliária"
            category:
              code: "4"
              description: "Pessoas Físicas"
            legacy: false
          - code: "4022"
            description: "Segurado Especial"
            category:
              code: "4"
              description: "Pessoas Físicas"
            legacy: false
          - code: "4081"
            description: "Contribuinte individual"
            category:
              code: "4"
              description: "Pessoas Físicas"
            legacy: false
          - code: "4090"
            description: "Candidato a Cargo Político Eletivo"
            category:
              code: "4"
              description: "Pessoas Físicas"
            legacy: false
          - code: "4111"
            description: "Leiloeiro"
            category:
              code: "4"
              description: "Pessoas Físicas"
            legacy: false
          - code: "4120"
            description: "Produtor Rural (Pessoa Física)"
            category:
              code: "4"
              description: "Pessoas Físicas"
            legacy: false
      - args: ["0"]
        returns: []
      - args: ["9"]
        returns: []
      - name: full-code-is-not-a-category
        args: ["2062"]
        returns: []
      - name: empty
        args: [""]
        returns: []
  parse:
    summary: Removes legal nature (natureza jurídica) formatting characters and returns only digits.
    description: |
      Removes legal nature formatting and keeps only digits, capped to 4 digits.
    references:
      - https://concla.ibge.gov.br/estrutura/natjur-estrutura/natureza-juridica-2021
      - https://concla.ibge.gov.br/images/concla/documentacao/CONCLA-TNJ2021-EstruturaDetalhada.pdf
    params:
      - name: value
        type: string | number
    returns: string
    tests:
      - name: masked
        args: ["206-2"]
        returns: "2062"
      - name: unmasked
        args: ["2062"]
        returns: "2062"
      - name: caps-length
        args: ["206299"]
        returns: "2062"
        note: reference truncates to 4 digits; asserted by the reference (JS) unit tests
      - name: empty
        args: [""]
        returns: ""
