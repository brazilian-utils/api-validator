domain: licensePlate
title: License plate
description: Brazilian vehicle license plates, old format (LLLNNNN) and Mercosul (LLLNLNN).
functions:
  convertToMercosul:
    summary: 'Converts an old format Brazilian license plate ("LLLNNNN") to the Mercosul format ("LLLNLNN"), following the official conversion
      table: the digit in the 5th position (the 2nd digit of the 4 digit number) becomes a letter, `0` through `9` mapping to `A` through
      `J`, and every other character is kept as is.'
    description: |
      Converts an old-format plate (`LLLNNNN`) to the Mercosul format (`LLLNLNN`): the 5th character, a digit, becomes a letter, `0` to `9` mapping to `A` to `J`; the result is upper-cased.

      - Pending decision (findings §1b): the reference (JS) also accepts the hyphen mask (`ABC-1234`); other libs reject it.
      - Pending decision (findings §2 #5): for a plate that is already Mercosul or is not a valid old-format plate, the reference (JS) returns an empty string; most libs return null.
    references:
      - https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022.pdf
      - https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf
    flatName: convertLicensePlateToMercosul
    level: core
    params:
      - name: value
        type: string
    returns: string
    tests:
      - name: old-format
        args: ["ABC1234"]
        returns: "ABC1C34"
      - name: digit-0-to-A
        args: ["ABC0000"]
        returns: "ABC0A00"
      - name: digit-9-to-J
        args: ["ABC9999"]
        returns: "ABC9J99"
      - name: lowercase
        args: ["abc1234"]
        returns: "ABC1C34"
      - name: hyphen-mask
        args: ["ABC-1234"]
        returns: "ABC1C34"
      - name: already-mercosul
        args: ["ABC1D23"]
        returns: ""
        note: no conversion possible; the reference returns an empty string (asserted by its tests), several libs return null/None instead
      - name: invalid
        args: ["invalid"]
        returns: ""
        note: the reference returns an empty string (asserted by its tests), several libs return null/None instead
      - name: empty
        args: [""]
        returns: ""
        note: the reference returns an empty string (asserted by its tests), several libs return null/None instead
  format:
    summary: Formats a Brazilian license plate (placa de carro ou moto).
    description: |
      Formats a license plate, upper-cased: old-format plates (`LLLNNNN`) get a hyphen (`ABC-1234`); Mercosul plates (`LLLNLNN`) have no separator.

      - Returns an empty string when the value cannot start a valid plate.
    references:
      - https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022.pdf
      - https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf
    level: core
    params:
      - name: value
        type: string
    returns: string
    tests:
      - args: ["WDG1S21"]
        returns: "WDG1S21"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["WDG1S22"]
        returns: "WDG1S22"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["wdg1s21"]
        returns: "WDG1S21"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["GJG8U81"]
        returns: "GJG8U81"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["GJG8U82"]
        returns: "GJG8U82"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["gjg8u81"]
        returns: "GJG8U81"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["KDS4W15"]
        returns: "KDS4W15"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["KDS4W16"]
        returns: "KDS4W16"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["kds4w15"]
        returns: "KDS4W15"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
  generate:
    summary: Generates a valid random Brazilian license plate (placa de carro ou moto).
    description: |
      Generates a valid random license plate, unformatted.

      - `format` is `LLLNLNN` (Mercosul, the default) or `LLLNNNN` (old format); any other value falls back to the default.
    references:
      - https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022.pdf
      - https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf
    level: core
    params:
      - name: format
        type: string
        optional: true
    returns: string
    tests:
      - name: generated-is-valid
        args: []
        satisfies: licensePlate.isValid
        repeat: 5
        note: every generated value must pass the lib's own validator
  getFormat:
    summary: Identifies the format of a Brazilian license plate (placa de carro ou moto).
    description: |
      Detects the format of a license plate: `LLLNNNN` for the old format, `LLLNLNN` for Mercosul.

      - Separators are removed first; case is ignored.
      - Returns null when the value is not 7 letters and digits in one of the two formats.
      - Pending decision (findings §1): Erlang returns named formats instead of the patterns.
    references:
      - https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022.pdf
      - https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf
    level: core
    params:
      - name: value
        type: string
    returns: string?
    tests:
      - args: ["WDG1S21"]
        returns: "LLLNLNN"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["WDG1S22"]
        returns: "LLLNLNN"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["wdg1s21"]
        returns: "LLLNLNN"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["GJG8U81"]
        returns: "LLLNLNN"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["GJG8U82"]
        returns: "LLLNLNN"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["gjg8u81"]
        returns: "LLLNLNN"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["KDS4W15"]
        returns: "LLLNLNN"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["KDS4W16"]
        returns: "LLLNLNN"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["kds4w15"]
        returns: "LLLNLNN"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
  isValid:
    summary: Validates if a Brazilian license plate (placa de carro ou moto) is valid.
    description: |
      Validates a license plate in the old format (`ABC1234`) or the Mercosul format (`ABC1D23`), in any case, with or without a hyphen or space.

      - Any other sequence of letters and digits, or extra characters, makes it invalid.
    references:
      - https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022.pdf
      - https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf
    level: core
    params:
      - name: value
        type: string
    returns: boolean
    tests:
      - args: ["WDG1S21"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["WDG1S22"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["wdg1s21"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["GJG8U81"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["GJG8U82"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["gjg8u81"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["KDS4W15"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["KDS4W16"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["kds4w15"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: [""]
        returns: false
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["   "]
        returns: false
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["abc"]
        returns: false
        note: consensus of 3 libs (javascript, python, ruby)
  parse:
    summary: Removes license plate formatting characters and returns only uppercase alphanumerics.
    description: |
      Removes separators from a license plate, upper-cases it and caps it to 7 characters.
    references:
      - https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022.pdf
    params:
      - name: value
        type: string
    returns: string
    tests:
      - name: old-format-masked
        args: ["abc-1234"]
        returns: "ABC1234"
      - name: mercosul-lowercase
        args: ["abc1d23"]
        returns: "ABC1D23"
      - name: empty
        args: [""]
        returns: ""
      - name: caps-length
        args: ["abc123456"]
        returns: "ABC1234"
        note: reference truncates to 7 characters; asserted by the reference (JS) unit tests
  removeSymbols:
    summary: Removes the formatting symbols (keeps everything else).
    level: core
    params:
      - name: value
        type: string
    returns: string
    tests:
      - args: ["WDG1S21"]
        returns: "WDG1S21"
        note: consensus of 3 libs (python, ruby, rust)
      - args: ["WDG1S22"]
        returns: "WDG1S22"
        note: consensus of 3 libs (python, ruby, rust)
      - args: ["wdg1s21"]
        returns: "wdg1s21"
        note: consensus of 3 libs (python, ruby, rust)
      - args: ["GJG8U81"]
        returns: "GJG8U81"
        note: consensus of 3 libs (python, ruby, rust)
      - args: ["GJG8U82"]
        returns: "GJG8U82"
        note: consensus of 3 libs (python, ruby, rust)
      - args: ["gjg8u81"]
        returns: "gjg8u81"
        note: consensus of 3 libs (python, ruby, rust)
      - args: ["KDS4W15"]
        returns: "KDS4W15"
        note: consensus of 3 libs (python, ruby, rust)
      - args: ["KDS4W16"]
        returns: "KDS4W16"
        note: consensus of 3 libs (python, ruby, rust)
      - args: ["kds4w15"]
        returns: "kds4w15"
        note: consensus of 3 libs (python, ruby, rust)
      - args: [""]
        returns: ""
        note: consensus of 3 libs (python, ruby, rust)
      - args: ["   "]
        returns: "   "
        note: consensus of 3 libs (python, ruby, rust)
      - args: ["abc"]
        returns: "abc"
        note: consensus of 3 libs (python, ruby, rust)
