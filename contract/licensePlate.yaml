domain: licensePlate
functions:
  convertToMercosul:
    summary: 'Converts an old format Brazilian license plate ("LLLNNNN") to the Mercosul format ("LLLNLNN"), following the official conversion
      table: the digit in the 5th position (the 2nd digit of the 4 digit number) becomes a letter, `0` through `9` mapping to `A` through
      `J`, and every other character is kept as is.'
    flatName: convertLicensePlateToMercosul
    level: core
    params:
      - name: value
        type: string
    returns: string
    tests:
      - name: old-format
        args: ["ABC1234"]
        returns: "ABC1C34"
      - name: digit-0-to-A
        args: ["ABC0000"]
        returns: "ABC0A00"
      - name: digit-9-to-J
        args: ["ABC9999"]
        returns: "ABC9J99"
      - name: lowercase
        args: ["abc1234"]
        returns: "ABC1C34"
      - name: hyphen-mask
        args: ["ABC-1234"]
        returns: "ABC1C34"
      - name: already-mercosul
        args: ["ABC1D23"]
        returns: ""
        note: no conversion possible; the reference returns an empty string (asserted by its tests), several libs return null/None instead
      - name: invalid
        args: ["invalid"]
        returns: ""
        note: the reference returns an empty string (asserted by its tests), several libs return null/None instead
      - name: empty
        args: [""]
        returns: ""
        note: the reference returns an empty string (asserted by its tests), several libs return null/None instead
  format:
    summary: Formats a Brazilian license plate (placa de carro ou moto).
    level: core
    params:
      - name: value
        type: string
    returns: string
    tests:
      - args: ["WDG1S21"]
        returns: "WDG1S21"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["WDG1S22"]
        returns: "WDG1S22"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["wdg1s21"]
        returns: "WDG1S21"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["GJG8U81"]
        returns: "GJG8U81"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["GJG8U82"]
        returns: "GJG8U82"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["gjg8u81"]
        returns: "GJG8U81"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["KDS4W15"]
        returns: "KDS4W15"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["KDS4W16"]
        returns: "KDS4W16"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["kds4w15"]
        returns: "KDS4W15"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
  generate:
    summary: Generates a valid random Brazilian license plate (placa de carro ou moto).
    level: core
    params:
      - name: format
        type: string
        optional: true
    returns: string
    tests:
      - name: generated-is-valid
        args: []
        satisfies: licensePlate.isValid
        repeat: 5
        note: every generated value must pass the lib's own validator
  getFormat:
    summary: Identifies the format of a Brazilian license plate (placa de carro ou moto).
    level: core
    params:
      - name: value
        type: string
    returns: string?
    tests:
      - args: ["WDG1S21"]
        returns: "LLLNLNN"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["WDG1S22"]
        returns: "LLLNLNN"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["wdg1s21"]
        returns: "LLLNLNN"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["GJG8U81"]
        returns: "LLLNLNN"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["GJG8U82"]
        returns: "LLLNLNN"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["gjg8u81"]
        returns: "LLLNLNN"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["KDS4W15"]
        returns: "LLLNLNN"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["KDS4W16"]
        returns: "LLLNLNN"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
      - args: ["kds4w15"]
        returns: "LLLNLNN"
        note: consensus of 5 libs (go, javascript, python, ruby, rust)
  isValid:
    summary: Validates if a Brazilian license plate (placa de carro ou moto) is valid.
    level: core
    params:
      - name: value
        type: string
    returns: boolean
    tests:
      - args: ["WDG1S21"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["WDG1S22"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["wdg1s21"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["GJG8U81"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["GJG8U82"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["gjg8u81"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["KDS4W15"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["KDS4W16"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["kds4w15"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: [""]
        returns: false
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["   "]
        returns: false
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["abc"]
        returns: false
        note: consensus of 3 libs (javascript, python, ruby)
  parse:
    summary: Removes license plate formatting characters and returns only uppercase alphanumerics.
    params:
      - name: value
        type: string
    returns: string
    tests:
      - name: old-format-masked
        args: ["abc-1234"]
        returns: "ABC1234"
      - name: mercosul-lowercase
        args: ["abc1d23"]
        returns: "ABC1D23"
      - name: empty
        args: [""]
        returns: ""
      - name: caps-length
        args: ["abc123456"]
        returns: "ABC1234"
        note: reference truncates to 7 characters; asserted by the reference (JS) unit tests
  removeSymbols:
    summary: Removes the formatting symbols (keeps everything else).
    level: core
    params:
      - name: value
        type: string
    returns: string
    tests:
      - args: ["WDG1S21"]
        returns: "WDG1S21"
        note: consensus of 3 libs (python, ruby, rust)
      - args: ["WDG1S22"]
        returns: "WDG1S22"
        note: consensus of 3 libs (python, ruby, rust)
      - args: ["wdg1s21"]
        returns: "wdg1s21"
        note: consensus of 3 libs (python, ruby, rust)
      - args: ["GJG8U81"]
        returns: "GJG8U81"
        note: consensus of 3 libs (python, ruby, rust)
      - args: ["GJG8U82"]
        returns: "GJG8U82"
        note: consensus of 3 libs (python, ruby, rust)
      - args: ["gjg8u81"]
        returns: "gjg8u81"
        note: consensus of 3 libs (python, ruby, rust)
      - args: ["KDS4W15"]
        returns: "KDS4W15"
        note: consensus of 3 libs (python, ruby, rust)
      - args: ["KDS4W16"]
        returns: "KDS4W16"
        note: consensus of 3 libs (python, ruby, rust)
      - args: ["kds4w15"]
        returns: "kds4w15"
        note: consensus of 3 libs (python, ruby, rust)
      - args: [""]
        returns: ""
        note: consensus of 3 libs (python, ruby, rust)
      - args: ["   "]
        returns: "   "
        note: consensus of 3 libs (python, ruby, rust)
      - args: ["abc"]
        returns: "abc"
        note: consensus of 3 libs (python, ruby, rust)
