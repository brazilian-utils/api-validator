domain: ncm
title: NCM — Nomenclatura Comum do Mercosul
description: Goods classification codes of the NCM table published by Siscomex.
functions:
  format:
    summary: Formats a NCM (Nomenclatura Comum do Mercosul) code.
    description: |
      Formats an NCM code with the mask `NNNN.NN.NN`; only the structure changes (use `ncm.isValid` to check the code).

      - Same rules as `cnae.format`; `options.pad` left-pads with zeros to 8 digits first.
    references:
      - https://portalunico.siscomex.gov.br/classif/api/publico/nomenclatura/download/json
    params:
      - name: value
        type: string | number
      - name: options
        type: FormatNcmOptions
        optional: true
    returns: string
    tests:
      - args: ["84713012"]
        returns: "8471.30.12"
      - name: already-formatted
        args: ["8471.30.12"]
        returns: "8471.30.12"
      - name: partial
        args: ["84713"]
        returns: "8471.3"
      - name: empty
        args: [""]
        returns: ""
  isValid:
    summary: Validates if a NCM (Nomenclatura Comum do Mercosul) code exists in the official table.
    description: |
      Checks whether an NCM code exists in the current table published by Siscomex.

      - Same input rules as `cbo.isValid`, with 8 digits and the `NNNN.NN.NN` mask.
    references:
      - https://portalunico.siscomex.gov.br/classif/api/publico/nomenclatura/download/json
    params:
      - name: value
        type: string | number
    returns: boolean
    tests:
      - args: ["22030000"]
        returns: true
      - name: masked
        args: ["2203.00.00"]
        returns: true
      - name: leading-zero
        args: ["01012100"]
        returns: true
      - name: nonexistent
        args: ["12345678"]
        returns: false
      - name: too-short
        args: ["2203000"]
        returns: false
      - name: letters
        args: ["abcdefgh"]
        returns: false
      - name: empty
        args: [""]
        returns: false
  parse:
    summary: Removes NCM (Nomenclatura Comum do Mercosul) formatting characters and returns only digits.
    description: |
      Removes NCM formatting and keeps only digits, capped to 8 digits.

      - Nothing is left-padded; a partial code is kept as written.
    references:
      - https://portalunico.siscomex.gov.br/classif/api/publico/nomenclatura/download/json
    params:
      - name: value
        type: string | number
    returns: string
    tests:
      - name: masked
        args: ["8471.30.12"]
        returns: "84713012"
      - name: unmasked
        args: ["84713012"]
        returns: "84713012"
      - name: strips-non-digits
        args: ["84?ABC71.30.12abc"]
        returns: "84713012"
      - name: empty
        args: [""]
        returns: ""
      - name: caps-length
        args: ["84713012999"]
        returns: "84713012"
        note: reference truncates to the 8 characters of the document; asserted by the reference (JS) unit tests
