domain: phone
functions:
  format:
    summary: Formats a phone number according to Brazilian phone number patterns.
    level: core
    params:
      - name: value
        type: string | number
      - name: options
        type: FormatPhoneOptions
        optional: true
    returns: string
    tests:
      - name: subscriber-number
        args: ["988887777"]
        returns: "98888-7777"
        note: default mask is the 9-digit subscriber number (no DDD); asserted by the reference (JS) unit tests
      - name: partial
        args: ["98888777"]
        returns: "98888-777"
      - name: empty
        args: [""]
        returns: ""
        note: several libs return null/None for input they cannot format; the reference returns an empty string
      - name: ddd-under-default-mask
        args: ["1130000000"]
        returns: "11300-0000"
        note: "CONTENTIOUS: the reference's default mask ('sn') ignores the DDD and keeps only the first 9 digits (documented and asserted by its
          tests); other libs format DDD + number, e.g. '(11)3000-0000'"
  generate:
    summary: Generates a random, structurally-valid Brazilian phone number (DDD + subscriber number, no formatting/mask applied, see
      `formatPhone` to format the result).
    level: core
    params:
      - name: type
        type: string
        optional: true
    returns: string
    tests:
      - name: generated-is-valid
        args: []
        satisfies: phone.isValid
        repeat: 5
        note: every generated value must pass the lib's own validator
  isValid:
    summary: Validates a Brazilian phone number.
    level: core
    params:
      - name: value
        type: string
      - name: options
        type: IsValidPhoneOptions
        optional: true
    returns: boolean
    tests:
      - args: ["48976579784"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["48976579785"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["00000000000"]
        returns: false
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["3147981464"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["3147981465"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["0000000000"]
        returns: false
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["38942432195"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["38942432196"]
        returns: true
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["48976-5797"]
        returns: false
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["31479-8146"]
        returns: false
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["38942-4321"]
        returns: false
        note: consensus of 3 libs (javascript, python, ruby)
      - args: [""]
        returns: false
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["   "]
        returns: false
        note: consensus of 3 libs (javascript, python, ruby)
      - args: ["abc"]
        returns: false
        note: consensus of 3 libs (javascript, python, ruby)
  isValidLandline:
    summary: Validates if a phone number is a valid Brazilian landline phone.
    params:
      - name: value
        type: string
    returns: boolean
    tests:
      - args: ["(11) 3000-0000"]
        returns: true
      - args: ["1130000000"]
        returns: true
      - name: country-code
        args: ["+55 11 3000-0000"]
        returns: true
      - name: mobile
        args: ["11987654321"]
        returns: false
      - name: 9-digits
        args: ["113000000"]
        returns: false
      - name: empty
        args: [""]
        returns: false
  isValidMobile:
    summary: Validates if a phone number is a valid Brazilian mobile phone.
    params:
      - name: value
        type: string
      - name: options
        type: IsValidMobilePhoneOptions
        optional: true
    returns: boolean
    tests:
      - args: ["(11) 98765-4321"]
        returns: true
      - name: country-code
        args: ["+55 11 98765-4321"]
        returns: true
      - args: ["5511987654321"]
        returns: true
      - name: landline
        args: ["1130000000"]
        returns: false
      - name: 10-digits
        args: ["1198765432"]
        returns: false
      - name: empty
        args: [""]
        returns: false
  isValidService:
    summary: Validates if a phone number is a valid Brazilian service number.
    params:
      - name: value
        type: string
    returns: boolean
    tests:
      - args: ["08001234567"]
        returns: true
      - name: masked
        args: ["0800 123 4567"]
        returns: true
      - name: abbreviated
        args: ["40041234"]
        returns: true
      - name: mobile
        args: ["11987654321"]
        returns: false
      - name: too-short
        args: ["0800123456"]
        returns: false
      - name: not-a-brazilian-short-code
        args: ["911"]
        returns: false
      - name: empty
        args: [""]
        returns: false
  parse:
    summary: Removes phone formatting characters, returns only digits, and caps the result to 11 digits.
    params:
      - name: value
        type: string | number
    returns: string
    tests:
      - name: masked-mobile
        args: ["(11) 98888-7777"]
        returns: "11988887777"
      - name: no-ddd
        args: ["98888-7777"]
        returns: "988887777"
      - name: country-code
        args: ["+55 11 98888-7777"]
        returns: "11988887777"
      - name: "0055"
        args: ["005511988887777"]
        returns: "11988887777"
      - name: bare-55-landline
        args: ["551130000000"]
        returns: "1130000000"
      - name: ddd-55
        args: ["55988887777"]
        returns: "55988887777"
        note: "11 digits: 55 is read as the DDD, not a country code; asserted by the reference (JS) unit tests"
      - name: service
        args: ["0800 123 4567"]
        returns: "08001234567"
      - name: caps-length
        args: ["11988887777123"]
        returns: "11988887777"
      - name: empty
        args: [""]
        returns: ""
  removeInternationalDialingCode:
    summary: Removes a leading +55 / 55.
    level: core
    params: &a1
      - name: value
        type: string
    returns: string
    tests:
      - args: ["48976579784"]
        returns: "48976579784"
        note: consensus of 4 libs (go, python, ruby, rust)
      - args: ["48976579785"]
        returns: "48976579785"
        note: consensus of 4 libs (go, python, ruby, rust)
      - args: ["00000000000"]
        returns: "00000000000"
        note: consensus of 4 libs (go, python, ruby, rust)
      - args: ["3147981464"]
        returns: "3147981464"
        note: consensus of 4 libs (go, python, ruby, rust)
      - args: ["3147981465"]
        returns: "3147981465"
        note: consensus of 4 libs (go, python, ruby, rust)
      - args: ["0000000000"]
        returns: "0000000000"
        note: consensus of 4 libs (go, python, ruby, rust)
      - args: ["38942432195"]
        returns: "38942432195"
        note: consensus of 4 libs (go, python, ruby, rust)
      - args: ["38942432196"]
        returns: "38942432196"
        note: consensus of 4 libs (go, python, ruby, rust)
      - args: ["48976-5797"]
        returns: "48976-5797"
        note: consensus of 4 libs (go, python, ruby, rust)
      - args: ["31479-8146"]
        returns: "31479-8146"
        note: consensus of 4 libs (go, python, ruby, rust)
      - args: ["38942-4321"]
        returns: "38942-4321"
        note: consensus of 4 libs (go, python, ruby, rust)
      - args: [""]
        returns: ""
        note: consensus of 4 libs (go, python, ruby, rust)
      - args: ["   "]
        returns: "   "
        note: consensus of 4 libs (go, python, ruby, rust)
      - args: ["abc"]
        returns: "abc"
        note: consensus of 4 libs (go, python, ruby, rust)
  removeSymbols:
    summary: Removes the formatting symbols (keeps everything else).
    level: core
    params: *a1
    returns: string
    tests:
      - args: ["48976579784"]
        returns: "48976579784"
        note: consensus of 4 libs (go, python, ruby, rust)
      - args: ["48976579785"]
        returns: "48976579785"
        note: consensus of 4 libs (go, python, ruby, rust)
