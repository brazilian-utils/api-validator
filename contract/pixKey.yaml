domain: pixKey
title: Pix key (chave Pix)
description: "Pix keys in the DICT formats: CPF, CNPJ, email, phone and random (EVP) keys."
functions:
  getInfo:
    summary: Identifies a Pix key and normalizes it to the canonical form the DICT expects inside a BR Code.
    description: |
      Identifies a Pix key and normalizes it to the canonical form the DICT expects inside a BR Code; returns null when the value is not a valid Pix key.

      - The result has the key type (CPF, CNPJ, email, phone or EVP) and the canonical value: digits for a CPF or CNPJ (letters upper-cased), a lowercase email, an E.164 phone or a lowercase UUID.
      - An 11-digit value valid as both CPF and mobile phone is a CPF, unless written as a phone (`+55` prefix or DDD in parentheses).
      - Landlines are not Pix keys; an email longer than 77 characters is rejected.
    references:
      - https://www.bcb.gov.br/content/estabilidadefinanceira/pix/Regulamento_Pix/II_ManualdePadroesparaIniciacaodoPix.pdf
      - https://www.bcb.gov.br/content/estabilidadefinanceira/pix/API-DICT.html
      - https://github.com/bacen/pix-api
    flatName: getPixKeyInfo
    params:
      - name: value
        type: string
    returns: PixKeyInfo?
    tests:
      - name: cpf
        args: ["123.456.789-09"]
        returns:
          type: "cpf"
          value: "12345678909"
      - name: cnpj
        args: ["00.038.166/0001-05"]
        returns:
          type: "cnpj"
          value: "00038166000105"
      - name: email
        args: ["fulano_da_silva.recebedor@example.com"]
        returns:
          type: "email"
          value: "fulano_da_silva.recebedor@example.com"
      - name: phone
        args: ["+5561912345678"]
        returns:
          type: "phone"
          value: "+5561912345678"
      - name: evp
        args: ["71c7d9be-4b85-4e43-9f1c-1f3b8b4e9a2d"]
        returns:
          type: "evp"
          value: "71c7d9be-4b85-4e43-9f1c-1f3b8b4e9a2d"
      - name: invalid-cpf
        args: ["11257245286"]
        returns: null
      - name: empty
        args: [""]
        returns: null
  isValid:
    summary: Validates a Pix key (chave Pix) against the DICT key formats.
    description: |
      Checks whether a value is a valid Pix key: a CPF, a CNPJ, an email, a Brazilian mobile phone or a random EVP key, per the DICT key formats.

      - Same recognition rules as `pixKey.getInfo`.
      - `options` can restrict the accepted key types; an empty list rejects everything.
    references:
      - https://www.bcb.gov.br/content/estabilidadefinanceira/pix/Regulamento_Pix/II_ManualdePadroesparaIniciacaodoPix.pdf
      - https://www.bcb.gov.br/content/estabilidadefinanceira/pix/API-DICT.html
      - https://github.com/bacen/pix-api
    params:
      - name: value
        type: string
      - name: options
        type: IsValidPixKeyOptions
        optional: true
    returns: boolean
    tests:
      - name: cpf
        args: ["123.456.789-09"]
        returns: true
      - name: cnpj
        args: ["00.038.166/0001-05"]
        returns: true
      - name: email
        args: ["fulano_da_silva.recebedor@example.com"]
        returns: true
      - name: phone
        args: ["+5561912345678"]
        returns: true
      - name: evp
        args: ["71c7d9be-4b85-4e43-9f1c-1f3b8b4e9a2d"]
        returns: true
      - name: invalid-cpf
        args: ["11257245286"]
        returns: false
      - name: email-without-tld
        args: ["fulano@example"]
        returns: false
      - name: landline
        args: ["1130000000"]
        returns: false
      - name: empty
        args: [""]
        returns: false
