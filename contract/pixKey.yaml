domain: pixKey
functions:
  getInfo:
    summary: Identifies a Pix key and normalizes it to the canonical form the DICT expects inside a BR Code.
    flatName: getPixKeyInfo
    params:
      - name: value
        type: string
    returns: PixKeyInfo?
    tests:
      - name: cpf
        args: ["123.456.789-09"]
        returns:
          type: "cpf"
          value: "12345678909"
      - name: cnpj
        args: ["00.038.166/0001-05"]
        returns:
          type: "cnpj"
          value: "00038166000105"
      - name: email
        args: ["fulano_da_silva.recebedor@example.com"]
        returns:
          type: "email"
          value: "fulano_da_silva.recebedor@example.com"
      - name: phone
        args: ["+5561912345678"]
        returns:
          type: "phone"
          value: "+5561912345678"
      - name: evp
        args: ["71c7d9be-4b85-4e43-9f1c-1f3b8b4e9a2d"]
        returns:
          type: "evp"
          value: "71c7d9be-4b85-4e43-9f1c-1f3b8b4e9a2d"
      - name: invalid-cpf
        args: ["11257245286"]
        returns: null
      - name: empty
        args: [""]
        returns: null
  isValid:
    summary: Validates a Pix key (chave Pix) against the DICT key formats.
    params:
      - name: value
        type: string
      - name: options
        type: IsValidPixKeyOptions
        optional: true
    returns: boolean
    tests:
      - name: cpf
        args: ["123.456.789-09"]
        returns: true
      - name: cnpj
        args: ["00.038.166/0001-05"]
        returns: true
      - name: email
        args: ["fulano_da_silva.recebedor@example.com"]
        returns: true
      - name: phone
        args: ["+5561912345678"]
        returns: true
      - name: evp
        args: ["71c7d9be-4b85-4e43-9f1c-1f3b8b4e9a2d"]
        returns: true
      - name: invalid-cpf
        args: ["11257245286"]
        returns: false
      - name: email-without-tld
        args: ["fulano@example"]
        returns: false
      - name: landline
        args: ["1130000000"]
        returns: false
      - name: empty
        args: [""]
        returns: false
