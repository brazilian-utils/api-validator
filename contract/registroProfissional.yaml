domain: registroProfissional
title: Registro profissional — professional council registration
description: Registration numbers of professional councils (OAB, CRM, CRO, CRP, CRC).
functions:
  isValid:
    summary: Checks the structure of a professional council registration number (registro/inscrição profissional).
    description: |
      Checks the structure of a professional council registration number: digit count and UF only, never a check digit.

      - `params` carries the value, the council (OAB, CRM, CRO, CRP or CRC) and optionally the expected state.
      - OAB and CRM: 4 to 6 digits plus the UF (`123456/SP`, `123456-SP`); CRO: 3 to 6 digits plus the UF.
      - CRP: a 2-digit regional code (`01` to `24`) plus 4 to 6 digits (`06/12345`); the expected state is ignored.
      - CRC: UF, 6 digits, registration type (`O` or `P`) and a digit (`SP-123456/O-3`), optionally a transfer suffix (`T-MG` or `S-MG`); the expected state matches the originating UF.
      - The OAB, CRM, CRO and CRP shapes are conventional (no published format). CREA is not covered.
    references:
      - https://cfc.org.br/wp-content/uploads/2018/04/1_manual_registro.pdf
      - https://www1.cfc.org.br/sisweb/SRE/docs/Res_1707.pdf
      - https://site.cfp.org.br/cfp/sistema-conselhos/conselhos-pelo-brasil/
      - https://www.oab.org.br/
      - https://portal.cfm.org.br/
      - https://cfo.org.br/
    params:
      - name: params
        type: IsValidRegistroProfissionalParams
    returns: boolean
