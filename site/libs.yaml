# The libraries shown on the site, in tab order. The first entry is the default tab.
#
# Each library keeps its own usage files at `<repo>/<path>/<util>.md`
# (see the "Usage files" contributing page). The site downloads them at build time.
#
#   id        stable identifier, also the folder name under generated/usage/ and fixtures/usage/
#   label     tab label (must be identical across the whole site for tab sync to work)
#   icon      Starlight icon name shown on the tab and the home page
#   repo      GitHub owner/name
#   ref       "latest-release" resolves the newest GitHub release; anything else is used as a git ref
#   path      folder inside the repo that holds one Markdown file per utility
#   package   published package name
#   install   one-line install command shown on the home page
#   registry  link to the package on its registry
#
# Go, Ruby, Rust, .NET and Erlang come later: add an entry here (and optionally a fixtures/usage/<id>/
# folder) and the tabs, badges and parity matrix pick them up automatically.

libs:
  - id: javascript
    label: JavaScript
    icon: seti:javascript
    repo: brazilian-utils/javascript
    ref: latest-release
    path: docs/usage
    package: "@brazilian-utils/brazilian-utils"
    install: npm install @brazilian-utils/brazilian-utils
    registry: https://www.npmjs.com/package/@brazilian-utils/brazilian-utils

  - id: python
    label: Python
    icon: seti:python
    repo: brazilian-utils/python
    ref: latest-release
    path: docs/usage
    package: brutils
    install: pip install brutils
    registry: https://pypi.org/project/brutils/
